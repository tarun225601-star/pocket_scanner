name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Recreate Android Platform to Fix Gradle
        run: |
          rm -rf android
          flutter create . --platforms=android

      - name: Install dependencies
        run: flutter pub get

      - name: Force Fix Flutter Blue Plus Gradle
        run: |
          find ~/.pub-cache -type f -name "build.gradle" | grep "flutter_blue_plus_android" | while read file; do
            echo "Injecting compileSdkVersion into $file"
            echo -e "\nandroid {\n    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 21\n    }\n}" >> "$file"
          done

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
